name: Tests and distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  distributions:
    needs: [test, ros2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aruco-pose-distributions
          path: dist/*
          if-no-files-found: error

  ros2:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    env:
      ROS_DOMAIN_ID: "83"
      ROS_LOCALHOST_ONLY: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install optional ROS example dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv libgl1 libglib2.0-0 ros-jazzy-tf2-ros ros-jazzy-tf2-msgs ros-jazzy-geometry-msgs ros-jazzy-diagnostic-msgs ros-jazzy-sensor-msgs
          python3 -m venv --system-site-packages /tmp/aruco-ros-venv
          /tmp/aruco-ros-venv/bin/python -m pip install -e . pytest
      - name: Track decoded replay through real ROS publishers and subscribers
        run: |
          source /opt/ros/jazzy/setup.bash
          /tmp/aruco-ros-venv/bin/python -m pytest examples/ros2 -q
